name: Test package

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package with MCP extra
        run: python -m pip install -e '.[mcp]'
      - name: Compile Python packages
        run: python -m compileall -q research_loop research_mcp
      - name: Smoke test local CLI
        run: |
          PROJECT="$(mktemp -d)/research-project"
          research-loop init "$PROJECT"
          cd "$PROJECT"
          research-loop new "smoke test"
          research-loop validate --all
      - name: Import MCP server
        env:
          RESEARCH_GITHUB_REPO: example/research
          GITHUB_TOKEN: placeholder
        run: python -c "import research_mcp.server; print('MCP import OK')"
